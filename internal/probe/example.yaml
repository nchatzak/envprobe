# envprobe configuration
#
# Every check has the same three fields:
#
#   name  - the label shown in output, and the key under `--json`. Must be unique.
#   type  - which check to run. One of: binary, docker-daemon, env, path, port.
#   with  - the payload for that type.
#
# Keys on a check and keys inside `with` are both validated: an unknown key is
# an error naming the key, so a typo fails loudly instead of being ignored.
# So is the top level: `checks:` is the only key allowed there, and it must be
# present.
#
# Delete what you don't need. An empty `checks:` list runs nothing and exits 0.

checks:
  # type: binary — is this executable on PATH?
  #
  #   target        the executable to look for. Defaults to `name`, so it can be
  #                 omitted when they are the same.
  #   version_args  optional. Arguments that make the tool print its version.
  #                 Omit them and envprobe only reports found/missing.
  #   version_constraint
  #                 optional. A constraint the reported version must satisfy,
  #                 such as ">= 1.24", "^1.24" or ">= 1.24, < 2". Requires
  #                 version_args; without it there is nothing to compare. A
  #                 version with more than three parts, such as 1.2.3.4,
  #                 cannot be compared and fails the check.
  - name: git
    type: binary
    with:
      version_args: ["--version"]

  # `name` is a display label, so it can differ from the executable.
  - name: Java
    type: binary
    with:
      target: java
      version_args: ["-version"] # note: one dash, and java prints to stderr

  # With a constraint, this fails on an older Go instead of reporting one.
  - name: Go
    type: binary
    with:
      target: go
      version_args: ["version"] # note: no dashes at all
      version_constraint: ">= 1.24"

  # No version_args — this only reports whether `terraform` is installed.
  - name: terraform
    type: binary

  # type: port — is something listening? Proves a service is *running*, not
  # merely installed.
  #
  #   target  required, "host:port". A bare port is not accepted.
  - name: postgres
    type: port
    with:
      target: localhost:5432

  - name: redis
    type: port
    with:
      target: 127.0.0.1:6379

  # type: docker-daemon — runs `docker info` to prove the daemon answers, which
  # the binary check alone cannot tell you. Takes no `with:` payload.
  - name: docker-daemon
    type: docker-daemon

  # type: env — is an environment variable set? Half of "my machine is set up
  # wrong" is an unset or stale JAVA_HOME, AWS_PROFILE or GOPRIVATE, and nothing
  # else here can see one.
  #
  #   target   the variable to read. Defaults to `name`, as with binary.
  #   matches  optional. A regular expression the value must satisfy. Without it
  #            the check only asks whether the variable is set, and an empty
  #            value passes. Write "." to require a non-empty one.
  #
  #            The pattern is a search, not an equality test: "prod" matches
  #            "nonprod" too. Anchor it as "^prod$" to pin an exact value.
  - name: AWS_PROFILE
    type: env

  # `name` is a display label here too, so `target` names the real variable.
  - name: Java home
    type: env
    with:
      target: JAVA_HOME
      matches: "."

  # type: path — does a file or directory exist? For the things a tool reads
  # rather than the tool itself: an SSH config, cloud credentials, a mounted
  # volume, a repo's .env.
  #
  #   target  required — `name` is a display label here, never a path. A leading
  #           ~ expands to your home directory; anywhere else it is a literal
  #           character. A relative path resolves against the directory you run
  #           envprobe from, not the one the config file sits in.
  #   kind    optional: file | dir. Omit it and either one passes; set it to
  #           tell "the wrong thing is there" from "nothing is there".
  #
  #           A symlink is followed, so `kind: file` passes on a link to one.
  - name: ssh config
    type: path
    with:
      target: ~/.ssh/config
      kind: file

  - name: kube config dir
    type: path
    with:
      target: ~/.kube
      kind: dir

  # No kind — this only asks whether something is there.
  - name: aws credentials
    type: path
    with:
      target: ~/.aws/credentials
